<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Raumplaner</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1f2328;--mut:#6b6f76;--acc:#2f6f5e;--line:#e3dfd6;--sel:#e0782f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.undo{display:flex;gap:4px}
.undo button{padding:6px 10px;font-size:17px;line-height:1}
.undo button:disabled{opacity:.35}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:700;letter-spacing:-.01em}
.seg{display:flex;background:#eeebe4;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;font:inherit;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002;font-weight:600}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#plan,#three{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#plan text{user-select:none;-webkit-user-select:none;pointer-events:none}
#sheet{background:var(--panel);border-top:1px solid var(--line);max-height:46vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
#tools{display:flex;gap:6px;padding:8px 10px;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
#tools button{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:#b3261e}
#props{padding:10px}
.hint{color:var(--mut);margin:4px 0;font-size:13.5px}
input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%;background:#fff;color:var(--ink);min-width:0}
input[type=color]{padding:2px;height:38px}
input[type=range]{padding:0}
label{display:block;font-size:12px;color:var(--mut)}
label input,label select{margin-top:3px}
.g2,.g3,.g4{display:grid;gap:8px;margin:8px 0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.sub{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.name{font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.oplist{display:flex;flex-direction:column;gap:6px}
.oplist button{text-align:left;display:flex;justify-content:space-between}
.oplist small{color:var(--mut)}
.mat{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:6px 0 2px}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.sw button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background-size:cover}
.sw button.on{box-shadow:0 0 0 2px var(--sel)}
#modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.mbox{background:#fff;width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead button{border:0;font-size:18px;padding:4px 8px}
#mbody{overflow:auto;padding:12px 14px}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat button{text-align:left;padding:10px}
.cat small{display:block;color:var(--mut);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;flex:0 0 auto}
.chips small{opacity:.7}
.drop{border:2px dashed #c9c3b6;border-radius:12px;padding:16px;text-align:center;margin:10px 0;color:var(--acc);font-weight:600;cursor:pointer}
.drop small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-block;font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--ink);cursor:pointer;position:relative}
.drop{display:block}
.thumbs .ord{position:absolute;left:4px;top:4px;background:var(--acc);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.thumbs>div.off{opacity:.45}
.magic{width:100%;margin:4px 0 2px;padding:12px;font-weight:600}
.thumbs .ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--mut);text-align:center;padding:4px}
.drop.over{background:#2f6f5e14;border-color:var(--acc)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.thumbs>div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eee;cursor:pointer}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tag,.pinb,.cap{position:absolute;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:5px;pointer-events:none}
.tag{left:4px;top:4px}.pinb{right:4px;top:4px}.cap{left:4px;right:4px;bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer{position:relative;touch-action:pan-y}
.viewer img,.viewer video{width:100%;max-height:58vh;object-fit:contain;background:#111;border-radius:10px;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:#000a;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;padding:0}
.nav.l{left:8px}.nav.r{right:8px}
textarea{width:100%;height:150px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px}
#walkui{position:absolute;inset:0;pointer-events:none}
.whint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:13px;padding:5px 10px;border-radius:20px;white-space:nowrap}
.wbtns{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;pointer-events:auto;align-items:center}
.wbtns label{background:#fffd;color:var(--ink);font-size:13px;padding:7px 10px;border-radius:10px;display:flex;gap:6px;align-items:center}
.wbtns input{width:auto;margin:0}
#lvlbar{position:absolute;left:8px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:4}
#lvlbar button{padding:5px 9px;font-size:12px;border-radius:8px;background:#fffe;box-shadow:0 1px 3px #0003;border:0;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#lvlbar button.on{background:var(--acc);color:#fff;font-weight:600}
#lvlbar button.ghost{background:#fff9;color:var(--mut)}
#c3ui{position:absolute;inset:0;pointer-events:none}
.c3top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;pointer-events:auto}
.c3top .seg{background:#fffd;box-shadow:0 1px 4px #0002}
.c3hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:12.5px;padding:5px 12px;border-radius:14px;text-align:center;width:max-content;max-width:90%}
.updown{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.updown button{width:54px;height:54px;border-radius:50%;font-size:20px;background:#fffd;box-shadow:0 1px 4px #0003;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{pointer-events:none;z-index:2;position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff40;border:2px solid #fff9;display:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fffc}
#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.5}
#ovbar{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#fffe;border-radius:12px;padding:6px 10px;display:flex;gap:8px;align-items:center;pointer-events:auto;font-size:13px;width:min(92%,380px)}
#ovbar input{flex:1}
#banner{position:absolute;top:10px;left:10px;right:10px;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13.5px;z-index:3}
#banner span{flex:1}
#banner button{background:#fff;border:0;padding:6px 10px}
#ar{position:fixed;inset:0;z-index:30;pointer-events:none;color:#fff;font-size:15px}
.arTop{position:absolute;top:0;left:0;right:0;padding:14px 12px 30px;background:linear-gradient(#000c,#0000);display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
.arTop span{flex:1;line-height:1.35}
.arTop button{background:#fff3;color:#fff;border:0}
.arBottom{position:absolute;bottom:0;left:0;right:0;padding:30px 12px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;background:linear-gradient(#0000,#000c);pointer-events:auto}
.arBottom button{min-height:46px}
.arBottom button.big{padding:12px 22px;font-size:17px}
.arBottom button:disabled{opacity:.4}
.rotrow{display:flex;gap:10px;align-items:center;margin:4px 0}
.rotrow input{flex:1}
.rotrow b{min-width:44px;text-align:right}
.wrow{display:flex;gap:3px;margin-top:3px}
.wrow input{margin:0}
.wrow button{padding:4px 6px;font-size:14px}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.arlist{width:100%;max-height:22vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.arlist div{display:flex;align-items:center;gap:8px;background:#0008;border-radius:8px;padding:4px 4px 4px 10px;font-size:14px}
.arlist span{flex:1}
.arlist button{background:#fff3;color:#fff;border:0;padding:4px 10px;min-height:0}
.arseg{width:100%;justify-content:center;margin-bottom:4px}
#arCross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0006}
#arDist{position:absolute;top:50%;left:50%;transform:translate(-50%,22px);background:#000a;padding:3px 9px;border-radius:8px;font-weight:600}
#vsv{position:absolute;pointer-events:none;touch-action:none}
.vtools{display:flex;gap:6px;margin-top:8px}
.vtools button{flex:1}
.pick{display:flex;align-items:center;gap:10px;margin:8px 0}
.pick span{width:42px;height:42px;border-radius:10px;border:1px solid var(--line)}
.sw .detlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.detrow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;align-items:center}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:auto;margin:0}
.chipb{width:auto;height:auto;border-radius:8px;padding:7px 9px;font-size:13px;box-shadow:none;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Raumplaner</h1>
    <div class="undo"><button id="undoB" data-act="undo" disabled aria-label="Rückgängig">↶</button><button id="redoB" data-act="redo" disabled aria-label="Wiederholen">↷</button></div>
    <div class="seg" id="tabs"><button data-m="2d" class="on">2D</button><button data-m="3d">3D</button><button data-m="walk">Laufen</button></div>
  </header>
  <div id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="layer"></g></svg>
    <canvas id="three" hidden></canvas>
    <div id="lvlbar"></div>
    <div id="banner" hidden><span id="btext"></span><button data-act="bannerDone" id="bbtn">Fertig</button></div>
    <div id="walkui" hidden>
      <img id="ov" hidden alt="">
      <div class="whint" id="whint">Links ziehen: gehen · Rechts ziehen: umsehen</div>
      <div id="ovbar" hidden>Foto <input type="range" id="ovop" min="0" max="1" step="0.05" value="0.5"> <button data-act="ovClose">✕</button></div>
      <div class="wbtns"><button data-act="comparePick">📷 Vergleichen</button><label><input type="checkbox" id="coll" checked> Wände</label></div>
    </div>
    <div id="c3ui" hidden>
      <div class="c3top"><div class="seg"><button data-act="cam3" data-k="orbit" class="on">⟲ Umkreisen</button><button data-act="cam3" data-k="free">✈ Frei bewegen</button></div></div>
      <div class="c3hint" id="c3hint"></div>
      <div class="updown" id="updown" hidden><button data-ud="1" aria-label="höher">▲</button><button data-ud="-1" aria-label="tiefer">▼</button></div>
    </div>
    <div id="joy"><div id="knob"></div></div>
  </div>
  <div id="sheet">
    <div id="tools">
      <button data-act="addRoom">＋ Raum</button>
      <button data-act="catalog">＋ Möbel</button>
      <button data-act="photos">📷 Fotos</button>
      <button data-act="data" style="flex:0 0 auto">⋯</button>
    </div>
    <div id="props"></div>
  </div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mhead"><b id="mtitle"></b><button data-act="close">✕</button></div><div id="mbody"></div></div></div>
<div id="ar" hidden><div id="arCross"></div><div id="arDist" hidden></div><div class="arTop"><span id="arMsg"></span><button data-act="arCancel">✕</button></div><div class="arBottom" id="arBtns"></div></div>
<div id="toast"></div>

const opts = (o, cur) => Object.entries(o).map(([k, v]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${v}</option>`).join('');
function matPicker(path, m, label) {
  return `<div class="sub">${label}</div>
    <div class="mat"><select data-m="${path}.t">${opts(MATS, m.t)}</select><input type="color" data-m="${path}.c" value="${m.c}"></div>
    <div class="sw">${(PRESETS[m.t] || PRESETS.plain).map(c => `<button data-act="swatch" data-path="${path}" data-c="${c}" class="${c === m.c ? 'on' : ''}" style="background:${swatchBg(m.t, c)}" aria-label="${c}"></button>`).join('')}</div>`;
}
function renderProps() {
  const P = $('#props');
  const o = sel && find(sel.t, sel.id);
  if (!o || sel.t === 'pin') { sel = null; P.innerHTML = `<p class="hint">Tippe einen Raum, ein Fenster, eine Tür oder ein Möbelstück an. Ziehen verschiebt – Möbel rasten an Wänden ein, Fenster und Türen gleiten an der Wand entlang. Zwei Finger zoomen.</p>`; return; }
  if (sel.t === 'room') {
    const n = o.pts.length, area = (Math.abs(area2(innerPts(o)))/2/10000).toFixed(1).replace('.', ',');
    const vs = selVtx && selVtx.room === o.id ? selVtx : null;
    P.innerHTML = `<input class="name" data-k="name" value="${esc(o.name)}">
      <div class="g2">${num('h', 'Raumhöhe (cm)', o.h)}<p class="hint" style="align-self:end">${n} Ecken · ${area} m² Fläche</p></div>
      <div class="sub">Wände – Innenmaß in cm</div>
      <div class="walls">${o.pts.map((_, i) => `<label>Wand ${i + 1}<span class="wrow"><input type="number" inputmode="decimal" data-wall="${i}" value="${Math.round(innerLen(o, i))}"><button data-act="wallAR" data-i="${i}" aria-label="Wand ${i + 1} mit Kamera messen">📐</button></span></label>`).join('')}</div>
      ${vs ? `<div class="bar" style="margin-top:8px"><b style="flex:1">Ecke ${vs.i + 1} ausgewählt</b><button class="danger" data-act="delVtx">Ecke löschen</button></div>` : ''}
      <p class="hint">Ecken im Plan ziehen (rasten gerade zur Nachbarecke ein). „+“ auf einer Wand fügt eine Ecke ein, Ecke antippen zum Löschen. Wandlänge ändern verschiebt alles hinter dem Wandende. 📐 misst eine einzelne Wand mit der Kamera nach.</p>
      ${S.floors.length > 1 ? `<label>Etage<select id="rLvl">${floorsSorted().map(f => `<option value="${f.id}" ${f.id === o.lvl ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>` : ''}
      <button class="magic" data-act="dock">🧲 An Nachbarraum andocken</button>
      <p class="hint">Dreht den Raum passend zur nächsten Nachbarwand und legt ihn bündig an. Beim Ziehen rasten Räume außerdem an Nachbarwänden und Ecken ein.</p>
      <div class="sub">Ausrichtung</div>
      <div class="rotrow"><input type="range" id="rang" min="0" max="359" step="1" value="${Math.round(o.ang || 0)}"><b id="rangv">${Math.round(o.ang || 0)}°</b></div>
      <div class="g4"><button data-act="rrot" data-v="-90">↺ 90°</button><button data-act="rrot" data-v="-15">↺ 15°</button><button data-act="rrot" data-v="15">↻ 15°</button><button data-act="rrot" data-v="90">↻ 90°</button></div>
      <div class="actions"><button data-act="ralign">Längste Wand waagerecht</button><button data-act="ralign" data-k="vert">… senkrecht</button></div>
      <p class="hint">Oder im Plan am ⟳-Griff über dem Raum drehen (rastet alle 15° ein). Möbel und Foto-Standorte drehen mit.</p>
      ${matPicker('floor', o.floor, 'Boden')}
      ${matPicker('wall', o.wall, 'Wände')}
      <div class="sub">Fenster, Türen & Durchgänge</div>
      <div class="oplist">${o.open.map(op => `<button data-act="selOpen" data-id="${op.id}"><span>${KINDS_OPEN[op.kind]} · Wand ${op.edge + 1}</span><small>${op.width} × ${op.height} cm ›</small></button>`).join('') || '<p class="hint">Noch keine.</p>'}</div>
      <div class="actions"><button data-act="addOpen" data-k="window">＋ Fenster</button><button data-act="addOpen" data-k="door">＋ Tür</button><button data-act="addOpen" data-k="open">＋ Durchgang</button></div>
      <p class="hint">Türen und Durchgänge an einer gemeinsamen Wand öffnen automatisch auch den Nachbarraum.</p>
      <button class="pri magic" data-act="arStart">📐 Mit Kamera vermessen</button>
      <button class="magic" data-act="arFurnStart">🛋 Möbel mit Kamera erfassen</button>
      ${sampleFn ? `<button class="magic" data-act="recon">🪄 Aus Fotos nachbauen (Claude)</button>` : ''}
      <div class="actions"><button data-act="photos">📷 Fotos (${S.media.filter(m => m.room === o.id).length})</button><button data-act="del" class="danger">Raum löschen</button></div>`;
  } else if (sel.t === 'open') {
    const r = roomOfOpen(o.id), isW = o.kind === 'window';
    const shapes = isW ? SHAPES : {rect:SHAPES.rect, arch:SHAPES.arch};
    const edges = Object.fromEntries(r.pts.map((_, i) => [String(i), edgeName(r, i)]));
    P.innerHTML = `<div class="bar"><button data-act="selRoom" data-id="${r.id}">← ${esc(r.name)}</button></div>
      <div class="g2"><label>Art<select data-k="kind">${opts(KINDS_OPEN, o.kind)}</select></label><label>Wand<select data-k="edge">${opts(edges, String(o.edge))}</select></label></div>
      <div class="g2"><label>Form<select data-k="shape">${opts(shapes, o.shape)}</select></label><label>Stil<select data-k="style">${opts(STYLES[o.kind], o.style)}</select></label></div>
      <div class="${isW ? 'g4' : 'g3'}">${num('offset', 'Abstand', o.offset)}${num('width', 'Breite', o.width)}${num('height', 'Höhe', o.height)}${isW ? num('sill', 'Brüstung', o.sill) : ''}</div>
      <p class="hint">Alle Maße in cm. Abstand = ab Ecke ${o.edge + 1} entlang der Wand.${isW ? ' Brüstung = Höhe der Unterkante über dem Boden.' : ''}</p>
      ${o.kind === 'open' && o.style === 'ohne' ? '' : matPicker('mat', o.mat, isW ? 'Rahmen' : o.kind === 'door' ? 'Türblatt & Zarge' : 'Zarge')}
      <div class="actions"><button data-act="delOpen" class="danger">Löschen</button></div>`;
  } else {
    P.innerHTML = `<input class="name" data-k="n" value="${esc(o.n)}">
      <div class="g3">${num('w', 'Breite', o.w)}${num('d', 'Tiefe', o.d)}${num('h', 'Höhe', o.h)}</div>
      <div class="g2"><label>Form<select data-k="k">${opts(KINDS, o.k)}</select></label>${num('e', 'Über Boden (cm)', o.e || 0)}</div>
      ${matPicker('mat', o.mat, 'Material')}
      <label>Drehung: <b id="rotv">${o.rot}°</b></label>
      <div class="g4"><button data-act="rot" data-v="-90">↺ 90°</button><button data-act="rot" data-v="-15">↺ 15°</button><button data-act="rot" data-v="15">↻ 15°</button><button data-act="rot" data-v="90">↻ 90°</button></div>
      <div class="actions"><button data-act="toWall" class="pri">⇤ Rückseite an Wand</button></div>
      <label style="margin-top:10px">Produkt-Link (optional)<input data-k="link" placeholder="https://www.ikea.com/de/de/p/…" value="${esc(o.link || '')}"></label>
      ${o.link ? `<p class="hint"><a href="${esc(o.link)}" target="_blank" rel="noopener">Produktseite öffnen ↗</a></p>` : ''}
      <div class="actions"><button data-act="dup">Duplizieren</button><button data-act="del" class="danger">Löschen</button></div>`;
  }
}
function changed(rebuildProps) { renderPlan(); if (mode !== '2d') build3D(); save(); if (rebuildProps) renderProps(); }
$('#props').addEventListener('input', e => {
  const o = sel && find(sel.t, sel.id); if (!o) return;
  const el = e.target; if (el.dataset.wall != null || el.id === 'rang') return;
  if (el.id === 'rLvl') { const r = sel && find('room', sel.id); if (r && el.value !== r.lvl) moveRoomToFloor(r, el.value); return; }
  const isNum = el.type === 'number'; let val = isNum ? (parseFloat(el.value) || 0) : el.value;
  let reprops = false;
  if (el.dataset.k) {
    const k = el.dataset.k;
    if (k === 'edge') val = +val;
    if (sel.t === 'open' && k === 'kind' && val !== o.kind) {
      const d = newOpen(val, roomOfOpen(o.id), o.edge);
      Object.assign(o, {kind:val, height:d.height, sill:d.sill, style:d.style, width:d.width});
      if (val !== 'window' && o.shape === 'round') o.shape = 'arch';
      reprops = true;
    } else o[k] = val;
    if (el.tagName === 'SELECT') reprops = true;
    if (sel.t === 'item' && ['w', 'd', 'h', 'k'].includes(k)) fitInRoom(o, roomAt(o.x, o.y), false);
  } else if (el.dataset.m) {
    const [p, f] = el.dataset.m.split('.');
    o[p][f] = val;
    if (f === 't') { o[p].c = (PRESETS[val] || PRESETS.plain)[0]; reprops = true; }
  } else return;
  changed(reprops && el.tagName === 'SELECT');
});
let rangBase = null;
$('#props').addEventListener('pointerdown', e => { if (e.target.id === 'rang') rangBase = null; });
$('#props').addEventListener('input', e => {
  if (e.target.id !== 'rang') return;
  const r = sel && sel.t === 'room' && find('room', sel.id); if (!r) return;
  if (!rangBase || rangBase.room !== r) rangBase = {room:r, base:rotBase(r)};
  const v = +e.target.value; rotateRoom(r, rangBase.base, v - rangBase.base.ang);
  $('#rangv').textContent = v + '°'; renderPlan(); if (mode !== '2d') build3D(); save();
});
$('#props').addEventListener('change', e => {
  if (e.target.id === 'rang') { rangBase = null; return; }
  const el = e.target; if (el.dataset.wall == null) return;
  const r = sel && sel.t === 'room' && find('room', sel.id); if (!r) return;
  const i = +el.dataset.wall, v = parseFloat(el.value);
  if (!(v > 10)) return renderProps();
  const kids = S.items.filter(it => roomAt(it.x, it.y) === r);
  stretchWall(r, i, v - innerLen(r, i));
  kids.forEach(it => fitInRoom(it, r, false));
  changed(true);
});

/* ================= Aktionen ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, o = sel && find(sel.t, sel.id);
  switch (act) {
    case 'close': closeModal(); break;
    case 'addRoom': {
      const B = bounds(), r = {id:uid(), lvl:S.cur, name:'Neuer Raum', pts:rectPts(R().length ? snap(B.x + B.w) : 0, R().length ? B.y : 0, 300, 300), h:250, floor:{t:'wood', c:'#c09060'}, wall:{t:'plaster', c:'#f4f1eb'}, open:[]};
      syncBox(r); S.rooms.push(r); sel = {t:'room', id:r.id}; fit(); changed(true); toast('Raum hinzugefügt – Maße unten eintragen'); break;
    }
    case 'catalog': openCatalog(); break;
    case 'addCat': { const c = CAT[+b.dataset.i]; addItem({...c, mat:{...c.m}}); closeModal(); break; }
    case 'addCustom': { const g = id => $('#' + id).value; addItem({n:g('cn') || 'Möbel', w:+g('cw') || 60, d:+g('cd') || 60, h:+g('ch') || 80, mat:{t:g('cmt'), c:g('cc')}, k:g('ck'), link:g('cl')}); closeModal(); break; }
    case 'swatch': { if (!o) break; o[b.dataset.path].c = b.dataset.c; changed(true); break; }
    case 'rot': if (o) { o.rot = ((o.rot + +b.dataset.v) % 360 + 360) % 360; fitInRoom(o, roomAt(o.x, o.y), false); $('#rotv').textContent = o.rot + '°'; changed(); } break;
    case 'toWall': if (o) { toWall(o); changed(true); } break;
    case 'dup': if (o) { const c = structuredClone(o); c.id = uid(); c.x += 20; c.y += 20; fitInRoom(c, roomAt(o.x, o.y), false); S.items.push(c); sel = {t:'item', id:c.id}; changed(true); } break;
    case 'del': if (o) {
      if (sel.t === 'room') { S.rooms = S.rooms.filter(r => r !== o); S.media = S.media.filter(m => m.room !== o.id); }
      else S.items = S.items.filter(i => i !== o);
      sel = null; changed(true);
    } break;
    case 'addOpen': if (o && sel.t === 'room') { const n = newOpen(b.dataset.k, o); o.open.push(n); sel = {t:'open', id:n.id}; changed(true); } break;
    case 'selOpen': sel = {t:'open', id:b.dataset.id}; renderPlan(); renderProps(); break;
    case 'selRoom': sel = {t:'room', id:b.dataset.id}; renderPlan(); renderProps(); break;
    case 'delOpen': if (o) { const r = roomOfOpen(o.id); r.open = r.open.filter(x => x !== o); sel = {t:'room', id:r.id}; changed(true); } break;
    case 'photos': openPhotos(sel && sel.t === 'room' ? sel.id : null); break;
    case 'photoRoom': openPhotos(b.dataset.id); break;
    case 'view': openViewer(+b.dataset.i); break;
    case 'vnav': openViewer(+b.dataset.i); break;
    case 'delMedia': { const id = b.dataset.id; S.media = S.media.filter(m => m.id !== id); save(); renderPlan(); openPhotos(); break; }
    case 'pin': { const m = find('pin', b.dataset.id); closeModal(); setMode('2d'); planMode = 'pin'; pinTarget = m; showBanner('Tippe dort, wo du beim Foto standest – und zieh in Blickrichtung.', 'Abbrechen'); break; }
    case 'unpin': { const m = find('pin', b.dataset.id); m.pin = null; save(); renderPlan(); openViewerFor(m); break; }
    case 'compare': closeModal(); startCompare(find('pin', b.dataset.id)); break;
    case 'comparePick': openComparePick(); break;
    case 'ovClose': $('#ov').hidden = true; $('#ovbar').hidden = true; $('#whint').hidden = false; break;
    case 'bgDel': S.bg = null; bgURL = ''; save(); renderPlan(); openPhotos(); break;
    case 'bgCalib': closeModal(); setMode('2d'); planMode = 'calib'; calib = []; showBanner('Tippe zwei Punkte einer Strecke, deren echte Länge du kennst (z. B. eine Wand).', 'Abbrechen'); renderPlan(); break;
    case 'bgMove': closeModal(); setMode('2d'); planMode = 'bgmove'; showBanner('Zieh den Grundriss an die richtige Stelle.'); renderPlan(); break;
    case 'calibOk': {
      const real = parseFloat($('#calv').value); if (!(real > 0)) return toast('Bitte Länge in cm eingeben');
      const d = dist(calib[0], calib[1]), f = real / d, A = calib[0];
      S.bg.w *= f; S.bg.x = A.x + (S.bg.x - A.x)*f; S.bg.y = A.y + (S.bg.y - A.y)*f;
      planMode = null; calib = []; hideBanner(); closeModal(); save(); renderPlan(); toast('Maßstab übernommen – jetzt Räume nachzeichnen'); break;
    }
    case 'bannerDone': planMode = null; pinTarget = null; calib = []; hideBanner(); renderPlan(); break;
    case 'recon': if (sel && sel.t === 'room' && modalKind !== 'photos' && modalKind !== 'recon') phRoom = sel.id; openRecon(); break;
    case 'reconToggle': { const id = b.dataset.id, k = reconSel.indexOf(id); if (k >= 0) reconSel.splice(k, 1); else if (reconSel.length < Math.min(sampleImgs?.maxCount || 6, 10)) reconSel.push(id); else toast('Maximal ' + Math.min(sampleImgs?.maxCount || 6, 10) + ' Fotos'); const r = find('room', phRoom); if (r) r.known = $('#rknown')?.value || r.known; openRecon(); break; }
    case 'reconGo': runRecon(); break;
    case 'reconStop': reconCtl?.abort(); break;
    case 'reconUndo': closeModal(); undo(); fit(); renderPlan(); break;
    case 'undo': undo(); break;
    case 'lvl': if (b.dataset.id === S.cur) { if (mode === '2d') openFloor(S.cur); } else switchFloor(b.dataset.id); break;
    case 'lvlAdd': openFloorAdd(); break;
    case 'lvlCreate': createFloor(b.dataset.src); break;
    case 'lvlDel': deleteFloor(b.dataset.id, b); break;
    case 'lvlAll': showAllFloors = !showAllFloors; build3D(); lvlUI(); break;
    case 'dock': if (o && sel.t === 'room') dockRoom(o); break;
    case 'cam3': if (mode === '3d' && b.dataset.k !== cam3) { cam3 = b.dataset.k; if (cam3 === 'free') camToFly(); else camToOrbit(); c3UI(); } break;
    case 'bkOut': exportBackup(); break;
    case 'redo': redo(); break;
    case 'to3d': closeModal(); setMode('3d'); break;
    case 'rrot': if (o && sel.t === 'room') { rotateRoom(o, rotBase(o), +b.dataset.v); changed(true); } break;
    case 'ralign': if (o && sel.t === 'room') {
      let best = null; for (let i = 0; i < o.pts.length; i++) { const e = edge(o, i); if (!best || e.L > best.L) best = e; }
      const a = Math.atan2(best.dy, best.dx)*180/Math.PI + (b.dataset.k === 'vert' ? 90 : 0);
      let d = -a; d = ((d + 90) % 180 + 180) % 180 - 90;
      rotateRoom(o, rotBase(o), d); changed(true);
    } break;
    case 'delVtx': if (o && selVtx && sel.t === 'room') { const kids = S.items.filter(it => roomAt(it.x, it.y) === o); removeVertex(o, selVtx.i); selVtx = null; fixOrientation(o); kids.forEach(it => fitInRoom(it, o, false)); changed(true); } break;
    case 'wallAR': if (o && sel.t === 'room') closeModal(), startAR(o.id, {mode:'wall', edge:+b.dataset.i}); break;
    case 'arFurnStart': if (o && sel.t === 'room') openFurnStart(o); break;
    case 'arFurnGo': if (o && sel.t === 'room') { closeModal(); startAR(o.id, {mode:'furn', edge:+b.dataset.e}); } break;
    case 'arStart': if (sel && sel.t === 'room') startAR(sel.id); else startAR(null); break;
    case 'arUndo': case 'arAdd': case 'arNext': case 'arMethod': case 'arToFurn': case 'arDetect': case 'arFurnDel': case 'arKind': case 'arFinish': case 'arCancel': arAct(act, b); break;
    case 'arApply': arApply(); break;
    case 'arRetry': closeModal(); startAR(arResult?.rid); break;
    case 'vtMode': case 'vtReset': case 'vtUndo': case 'vtPreset': case 'pipTo': case 'detApply': vtAct(act, b); break;
    case 'data': openData(); break;
    case 'copy': navigator.clipboard.writeText($('#json').value).then(() => toast('Kopiert'), () => { $('#json').select(); toast('Bitte manuell kopieren'); }); break;
    case 'import': try { const d = JSON.parse($('#json').value); if (!d.rooms) throw 0; S = migrate(d); sel = null; save(); closeModal(); fit(); changed(true); toast('Importiert – mit ↶ rückgängig machbar'); } catch (er) { toast('Ungültige Daten'); } break;
    case 'reset': if (b.dataset.sure) { S = defaults(); sel = null; bgURL = ''; resetHistory(); persist(lastSnap); gcMedia(); closeModal(); fit(); changed(true); } else { b.dataset.sure = 1; b.textContent = 'Wirklich alles löschen?'; } break;
  }
});
function addItem(c) {
  const it = {id:uid(), lvl:S.cur, n:c.n, w:c.w, d:c.d, h:c.h, mat:c.mat, k:c.k || 'box', link:c.link || '', rot:0, e:c.e || 0, x:0, y:0};
  const r = (sel && sel.t === 'room' && find('room', sel.id)) || roomAt(V.cx, V.cy) || R()[0];
  if (r) { const lp = labelPoint(r); it.x = snap(lp.x); it.y = snap(lp.y); fitInRoom(it, r, false); } else { it.x = snap(V.cx); it.y = snap(V.cy); }
  S.items.push(it); sel = {t:'item', id:it.id}; changed(true); toast(`${it.n} platziert`);
}

/* ================= Modals ================= */
let modalKind = '';
function openModal(title, html, kind = '') { modalKind = kind; $('#mtitle').textContent = title; $('#mbody').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; modalKind = ''; $('#mbody').querySelectorAll('video').forEach(v => v.pause()); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
async function hydrate() {
  for (const el of $('#mbody').querySelectorAll('[data-mid]')) {
    el.onerror = () => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = 'Vorschau nicht möglich (Format)'; el.replaceWith(d); };
    const u = await mediaURL(el.dataset.mid); if (u) el.src = u; else el.onerror();
  }
}

function openCatalog() {
  const groups = [...new Set(CAT.map(c => c.g))];
  const catHTML = q => { q = q.toLowerCase(); return groups.map(g => { const its = CAT.map((c, i) => [c, i]).filter(([c]) => c.g === g && c.n.toLowerCase().includes(q)); return its.length ? `<div class="sub">${g}</div><div class="cat">${its.map(([c, i]) => `<button data-act="addCat" data-i="${i}">${esc(c.n)}<small>${c.w} × ${c.d} × ${c.h} cm</small></button>`).join('')}</div>` : ''; }).join(''); };
  openModal('Möbel hinzufügen', `
    <input id="q" placeholder="Suchen, z. B. KALLAX">
    <div id="catlist">${catHTML('')}</div>
    <p class="hint" style="margin-top:8px">Maße sind Richtwerte – mit der Produktseite abgleichen.</p>
    <div class="sub">Eigenes Möbelstück</div>
    <input id="cn" placeholder="Name, z. B. HEMNES Kommode">
    <div class="g3"><label>Breite<input id="cw" type="number" value="80"></label><label>Tiefe<input id="cd" type="number" value="50"></label><label>Höhe<input id="ch" type="number" value="90"></label></div>
    <div class="g3"><label>Form<select id="ck">${opts(KINDS, 'cabinet')}</select></label><label>Material<select id="cmt">${opts(MATS, 'wood')}</select></label><label>Farbe<input id="cc" type="color" value="#c09060"></label></div>
    <input id="cl" placeholder="Produkt-Link (optional)">
    <div class="actions"><button class="pri" data-act="addCustom">Hinzufügen</button></div>`);
  $('#q').addEventListener('input', e => $('#catlist').innerHTML = catHTML(e.target.value));
}

/* ---- Fotos ---- */
let phRoom = null;
const roomMedia = () => S.media.filter(m => m.room === phRoom);
function openPhotos(rid) {
  phRoom = rid || (phRoom && find('room', phRoom) ? phRoom : S.rooms[0]?.id);
  const r = phRoom && find('room', phRoom), list = roomMedia();
  openModal('Referenz-Fotos & Videos', `
    <div class="chips">${S.rooms.map(x => `<button data-act="photoRoom" data-id="${x.id}" class="${x.id === phRoom ? 'pri' : ''}">${esc(x.name)} <small>${S.media.filter(m => m.room === x.id).length}</small></button>`).join('') || '<p class="hint">Lege zuerst einen Raum an.</p>'}</div>

async function videoFrames(blob, n) {
  const url = URL.createObjectURL(blob), v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  const out = [];
  try {
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 12000); });
    const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 3;
    for (let i = 1; i <= n; i++) {
      v.currentTime = dur * i / (n + 1);
      await new Promise(r => { v.onseeked = r; setTimeout(r, 4000); });
      const k = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85)); if (b) out.push(b);
    }
  } catch (e) {}
  URL.revokeObjectURL(url); return out;
}
async function collectImages(ids) {
  const max = sampleImgs.maxCount, types = sampleImgs.mediaTypes || ['image/jpeg', 'image/png', 'image/webp'], out = [];
  const vids = ids.filter(id => find('pin', id)?.type === 'vid').length;
  for (const id of ids) {
    if (out.length >= max) break;
    const m = find('pin', id), b = await DB.get(id); if (!b) continue;
    if (m.type === 'vid') {
      const left = max - out.length, per = Math.max(1, Math.min(4, Math.floor(left / Math.max(1, vids))));
      out.push(...(await videoFrames(b, per)).slice(0, left));
    } else if (types.includes(b.type) && b.size <= sampleImgs.maxInputBytes) out.push(b);
    else { try { out.push((await shrink(b, 1600, .85)).blob); } catch (e) {} }
  }
  return out.slice(0, max);
}

    last = 0; raf = requestAnimationFrame(loop);
  } else if (focus) applyFocus(focus, '2d'); else requestAnimationFrame(() => renderPlan());
}
